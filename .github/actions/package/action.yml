name: Build plugin archive
description: Validate the release version and build a deterministic plugin archive.

outputs:
  version:
    description: Validated semantic version.
    value: ${{ steps.package.outputs.version }}
  archive:
    description: Release archive path.
    value: ${{ steps.package.outputs.archive }}
  checksum:
    description: SHA-256 checksum file path.
    value: ${{ steps.package.outputs.checksum }}
  digest:
    description: Archive SHA-256 digest without an algorithm prefix.
    value: ${{ steps.package.outputs.digest }}

runs:
  using: composite
  steps:
    - id: package
      shell: bash
      env:
        EXPECTED_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      run: |
        set -euo pipefail

        version="$(tr -d '\r\n' < VERSION)"
        if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
          echo "VERSION must be a stable MAJOR.MINOR.PATCH SemVer: $version" >&2
          exit 1
        fi
        if [[ -n "$EXPECTED_TAG" && "$EXPECTED_TAG" != "v$version" ]]; then
          echo "tag $EXPECTED_TAG does not match VERSION v$version" >&2
          exit 1
        fi
        if [[ "$(python3 scripts/tokenpipe.py --version)" != "$version" ]]; then
          echo "scripts/tokenpipe.py version does not match VERSION" >&2
          exit 1
        fi

        for manifest in .codex-plugin/plugin.json .claude-plugin/plugin.json; do
          jq -e --arg version "$version" '.version == $version' "$manifest" >/dev/null
        done
        jq -e --arg version "$version" '.plugins[0].version == $version' \
          .claude-plugin/marketplace.json >/dev/null
        jq -e --arg ref "v$version" '.plugins[0].source.ref == $ref' \
          .agents/plugins/marketplace.json >/dev/null
        changelog_version="${version//./\\.}"
        grep -Eq "^## \[$changelog_version\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md

        files=(
          .agents/plugins/marketplace.json
          .claude-plugin/marketplace.json
          .claude-plugin/plugin.json
          .codex-plugin/plugin.json
          AGENTS.md
          CHANGELOG.md
          CLAUDE.md
          LICENSE
          README.md
          SECURITY.md
          VERSION
          hooks/claude_post_tool.py
          hooks/common.py
          hooks/hooks.json
          hooks/post_tool.py
          hooks/pre_tool.py
          scripts/tokenpipe.py
        )
        git ls-files --error-unmatch -- "${files[@]}" >/dev/null
        if git ls-files -s -- "${files[@]}" | awk '$1 == "120000" { found=1 } END { exit !found }'; then
          echo "release allowlist must not contain symlinks" >&2
          exit 1
        fi

        mkdir -p dist
        archive="dist/agent-pipline-compressor-v${version}.tar.gz"
        checksum="${archive}.sha256"
        prefix="agent-pipline-compressor-v${version}/"
        git archive --format=tar --prefix="$prefix" HEAD -- "${files[@]}" | gzip -n > "$archive"
        digest="$(sha256sum "$archive" | awk '{print $1}')"
        printf '%s  %s\n' "$digest" "$(basename "$archive")" > "$checksum"

        {
          echo "version=$version"
          echo "archive=$archive"
          echo "checksum=$checksum"
          echo "digest=$digest"
        } >> "$GITHUB_OUTPUT"
