name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.14"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Configure deterministic RTK fixture
        uses: ./.github/actions/test-rtk
      - name: Validate source and manifests
        run: |
          set -euo pipefail
          python3 -m compileall -q scripts hooks benchmarks tests
          python3 -m unittest discover -s tests -v
          while IFS= read -r file; do jq empty "$file"; done < <(git ls-files '*.json')
      - id: first
        name: Build deterministic package
        uses: ./.github/actions/package
      - id: second
        name: Rebuild deterministic package
        uses: ./.github/actions/package
      - name: Compare package builds
        env:
          FIRST_DIGEST: ${{ steps.first.outputs.digest }}
          SECOND_DIGEST: ${{ steps.second.outputs.digest }}
        run: test "$FIRST_DIGEST" = "$SECOND_DIGEST"
